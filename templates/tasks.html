{% extends 'base.html' %}
{% block title %}Task Manager | Semester Cracker{% endblock %}
{% block page_heading %}Task Manager{% endblock %}
{% block content %}
<section class="page-section card">
  <div class="panel-header">
    <h3>Task Manager</h3>
    <div class="stats-pills">
      <span class="pill neutral" id="pending-count">0 Pending</span>
      <span class="pill success" id="completed-count">0 Completed</span>
    </div>
  </div>

  <form id="task-form" class="form-grid">
    <input type="hidden" id="task-id" />
    <label><span>Title</span><input id="task-title" required /></label>
    <label><span>Category</span><input id="task-category" placeholder="Math, Physics..." /></label>
    <label><span>Due date</span><input id="task-date" type="date" /></label>
    <label><span>Priority</span>
      <select id="task-priority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
    </label>
    <label class="full-width"><span>Description</span><textarea id="task-description" rows="3"></textarea></label>
    <div class="form-actions full-width">
      <button type="submit" class="primary-btn">Save Task</button>
      <button type="button" class="secondary-btn" id="task-reset">Clear</button>
    </div>
  </form>
</section>

<section class="page-section card">
  <div class="panel-header compact">
    <h3>Task List</h3>
    <div class="toolbar">
      <input id="task-search" type="search" placeholder="Search tasks" />
      <select id="task-filter">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
        <option value="overdue">Overdue</option>
      </select>
      <select id="task-sort">
        <option value="due">Sort by due date</option>
        <option value="priority">Sort by priority</option>
        <option value="created">Newest</option>
      </select>
    </div>
  </div>
  <div id="tasks-list" class="task-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
{% endblock %}
