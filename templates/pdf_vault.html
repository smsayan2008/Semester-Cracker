{% extends 'base.html' %}
{% block title %}PDF Vault | Semester Cracker{% endblock %}
{% block page_heading %}PDF Vault{% endblock %}
{% block content %}
<section class="page-section card">
  <div class="panel-header">
    <h3>Private PDF Vault</h3>
    <label class="upload-label">
      <input id="pdf-upload" type="file" accept="application/pdf" />
      <span>Add PDF</span>
    </label>
  </div>
  <div id="pdf-list" class="pdf-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pdf-vault.js') }}"></script>
{% endblock %}
